<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background: linear-gradient(to right,#4facfe,#00f2fe);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.card{
width:450px;
border-radius:12px;
}
</style>

</head>

<body>

<div class="card shadow-lg">

<div class="card-header text-center bg-dark text-white">
<h3>Student Registration</h3>
</div>

<div class="card-body">

<form action="StudentServlet" method="post">

<div class="mb-3">
<label class="form-label">Student Name</label>
<input type="text" name="name" class="form-control" placeholder="Enter full name" required>
</div>

<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email" name="email" class="form-control" placeholder="example@email.com" required>
</div>

<div class="mb-3">
<label class="form-label">Course</label>
<input type="text" name="course" class="form-control" placeholder="Example: CSE / AIML" required>
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="tel" name="phone" class="form-control" placeholder="10 digit phone number" pattern="[0-9]{10}" required>
</div>

<div class="d-grid gap-2">

<button type="submit" class="btn btn-success">
Add Student
</button>

<a href="StudentServlet" class="btn btn-secondary">
View Students
</a>
<a href="index.html" class="btn btn-danger">Back</a>

</div>

</form>

</div>

</div>

</body>
</html>
